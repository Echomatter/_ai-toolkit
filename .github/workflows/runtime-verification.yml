name: Runtime verification

on:
  push:
    branches: [main, "chatgpt/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Isolated execution contracts
        shell: pwsh
        run: |
          node --test tests/delegate-runtime.test.mjs tests/presentation.test.mjs tests/usage.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Selector and quota contracts
        shell: powershell
        run: .\tests\selector-contract.ps1
      - name: Isolated deployment contracts
        shell: powershell
        run: .\tests\deployment-contract.ps1
      - name: Isolated outcome contracts
        shell: powershell
        run: .\tests\outcome-contract.ps1
      - name: Quota regression entrypoint
        shell: powershell
        run: .\scripts\test-quota-routing.ps1
      - name: Refresh preserves history and evidence
        shell: powershell
        run: .\tests\refresh-contract.ps1
      - name: Archive tested revision
        if: always()
        shell: pwsh
        run: git archive --format=zip --output=toolkit-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolkit-source-${{ github.sha }}
          path: toolkit-source.zip
          retention-days: 7
