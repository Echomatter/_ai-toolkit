name: Tokenomics Windows CI

on:
  push:
    branches: [ main, "chatgpt/**", "codex/**" ]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Tokenomics-OpenCode-Desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evidence capture contracts
        shell: powershell
        run: |
          python tools/evidence.py validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/evidence_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Structural validation
        shell: powershell
        run: .\scripts\validate.ps1
      - name: Advisor regression tests
        shell: powershell
        run: .\scripts\test-advisor.ps1
      - name: Content index smoke test
        shell: powershell
        run: .\scripts\test-content-index.ps1
