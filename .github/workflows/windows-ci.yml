name: Windows toolkit CI

on:
  push:
    branches: [ main, "chatgpt/**" ]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural validation
        shell: powershell
        run: .\scripts\validate.ps1
      - name: Advisor regression tests
        shell: powershell
        run: .\scripts\test-advisor.ps1
